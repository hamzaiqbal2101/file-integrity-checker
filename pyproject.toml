[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-checker"
version = "1.0.0"
description = "Production-style file integrity verifier: chunked hashing, JSON baselines, and tamper detection with CI-ready exit codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamza Iqbal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
file-integrity-checker = "file_integrity_checker.cli:main"

[tool.setuptools]
packages = ["file_integrity_checker"]